<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro de Estudiantes</title>
    <script src="utilitarios.js"></script>
    <script src="registroEstudiante.js"></script>
    
    <link rel="stylesheet" href="registroEstudiante.css">
</head>
<body onload="MostraListaEstudiantes();">
    <div>
        <div >
            <h1 class="TituloPrincipal">REGISTRO ESTUDIANTIL</h1>
        </div>
        <div class="Informacion">
            
            <div class="ContenidosRegsitroLista">
                <div class="ContenedorRegistro">
                    <h3 class="TituloSecundario">REGISTRATE</h3>
                    <div class="InformacionEstudiante">
                        <div class="TextoRegistro">
                            <div>
                                <h3 class="Texto">Nombres:</h3>
                            </div>
                            <div>
                                <h3 class="Texto">Apellidos:</h3>
                            </div>
                            <div>
                                <h3 class="Texto">Correo Electronico:</h3>
                            </div>
                            <div>
                                <h3 class="Texto">Id del Estudiante:</h3>
                            </div>
                        </div>
                        <div class="CajaRegistro">
                                <input type="text" id="CajaNombres" class="RespuestaCaja"/>
                            <div>
                                <h3 id="ErrorCajaNombre" class="ErrorCaja"></h3>
                            </div>
                                <input type="text" id="CajaApellidos" class="RespuestaCaja"/>
                            <div>
                                <h3 id="ErrorCajaApellido" class="ErrorCaja"></h3>
                            </div>  
                                <input type="text" id="CajaCorreoElectronico" class="RespuestaCaja"/>
                            <div>
                                <h3 id="ErrorCajaCorreo" class="ErrorCaja"></h3>
                            </div> 
                                <input type="text" id="CajaIdEstudiante" class="RespuestaCaja"/>
                            <div>
                                <h3 id="ErrorCajaIdEstudiante" class="ErrorCaja"></h3>
                            </div>
                        </div>
                    </div>
                    <div class="Boton">
                        <input type="button" value="GUARDAR" id="" class="BotonGuardar" onclick="guardar();">
                        <input type="button" value="ELIMINAR" id="" class="BotonEliminar" onclick="eliminarEstudiante();">
                    </div>
                </div>
                <div class="ContenedorTable">
                    <div id="ListaEstudiantes"></div>
                </div>
            </div>
            
        </div>
    </div>
</body>
</html>
